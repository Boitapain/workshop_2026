# Dashboard ops : publié uniquement sur 127.0.0.1 du PC Hôte. Proxy en LECTURE SEULE vers les API internes.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;

    location / {
        try_files $uri /index.html;
    }

    location /engine/ {
        limit_except GET { deny all; }
        proxy_pass http://remediation-engine:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;              # SSE
        proxy_read_timeout 1h;
    }
    location = /prom/query       { limit_except GET { deny all; } proxy_pass http://prometheus:9090/api/v1/query$is_args$args; }
    location = /prom/query_range { limit_except GET { deny all; } proxy_pass http://prometheus:9090/api/v1/query_range$is_args$args; }
    location = /probe/last       { proxy_pass http://synthetic-probe:8000/last-result; }
    location = /ml/status        { proxy_pass http://ml-detector:8000/status; }

    # Assistant RAG (profil facultatif) : résolution DNS à la demande pour démarrer même s'il est absent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ "^/rag/(ask|report/inc-[0-9a-f]{8})$" {
        limit_except POST { deny all; }
        set $rag http://rag-assistant:8000;
        proxy_pass $rag/$1;
        proxy_read_timeout 180s;
    }
}
