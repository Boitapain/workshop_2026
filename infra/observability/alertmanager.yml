route:
  receiver: remediation-engine
  group_by: [alertname]
  group_wait: 0s
  group_interval: 10s
  repeat_interval: 1m
receivers:
  - name: remediation-engine
    webhook_configs:
      - url: http://remediation-engine:8000/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/internal_token
