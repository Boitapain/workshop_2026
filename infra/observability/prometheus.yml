global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

rule_files: ["/etc/prometheus/rules/*.yml"]

scrape_configs:
  - job_name: auth-service
    static_configs: [{ targets: ["auth-service:8000"] }]
  - job_name: payment-service
    static_configs: [{ targets: ["payment-service:8000"] }]
  - job_name: synthetic-probe
    static_configs: [{ targets: ["synthetic-probe:8000"] }]
  - job_name: pg-backup
    static_configs: [{ targets: ["pg-backup:8080"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: ml-detector
    static_configs: [{ targets: ["ml-detector:8000"] }]
  - job_name: remediation-engine
    static_configs: [{ targets: ["remediation-engine:8000"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
